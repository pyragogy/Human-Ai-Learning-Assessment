<rect x="205" y="447" width="690" height="137" rx="19" fill="#163b48" stroke="#8ce8df" stroke-width="2"/>
<text x="550" y="490" fill="#ffffff" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">JOINT SCIENTIFIC STUDY</text>
<text x="550" y="525" fill="#d7eeef" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Real-world data · reproducible analysis · transparent findings</text>
<text x="550" y="555" fill="#d7eeef" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Including negative or inconclusive results</text>
<text x="550" y="620" fill="#94acc5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Illustrative partnership structure · no agreement, recruitment or approvals are currently in place.</text>
