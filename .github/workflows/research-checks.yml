name: Research integrity checks
# Run full integrity checks only when executable research code or this workflow
# changes. Documentation-only proposal edits do not need a Python runner.
on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/research-checks.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/research-checks.yml'
  workflow_dispatch:

# Many consecutive writes can otherwise queue redundant Linux runners.
# Keep independent PR/main check groups; abandon superseded attempts.
concurrency:
  group: integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data validation and score independence
        run: python -m unittest discover -s prototype/tests -v
      - name: Demonstrate synthetic pipeline
        run: python prototype/analyse.py prototype/fixtures/synthetic_scores.csv
      - name: Generate synthetic A/B/C study journey
        run: |
          python prototype/journey.py > synthetic_journey.json
          python -m json.tool synthetic_journey.json > /dev/null
      - name: Smoke-test HALA web demonstrator
        run: |
          python -c "from pathlib import Path; p=Path('prototype/webdemo/index.html'); assert p.exists() and b'HALA' in p.read_bytes()"
      - name: Validate research entrypoints compile
        run: python -m compileall -q prototype
